trigger:
  branches:
    include:
      - main

variables:
  ENV: sandbox
  CI_WORKER_COUNT: 4
  SHARD_COUNT: 4

stages:
  - stage: StaticChecks
    jobs:
      - job: RuntimeImportPolicy
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.11'
          - script: pip install -r requirements.txt
            displayName: Install dependencies
          - script: python tools/lint_no_runtime_pandas.py
            displayName: Enforce Excel adapter boundary

  - stage: APITests
    dependsOn: StaticChecks
    jobs:
      - job: FastTests
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.11'
          - script: pip install -r requirements.txt
            displayName: Install dependencies
          - script: |
              mkdir -p $(Build.ArtifactStagingDirectory)/html-api
              pytest tests/api/ tests/infra/ \
                -n $(CI_WORKER_COUNT) \
                --dist worksteal \
                --html=$(Build.ArtifactStagingDirectory)/html-api/report.html \
                --self-contained-html \
                --junitxml=$(Build.ArtifactStagingDirectory)/junit-api.xml
            displayName: Run API and infra tests
            env:
              ENV: $(ENV)
              CI_WORKER_COUNT: $(CI_WORKER_COUNT)
          - task: PublishTestResults@2
            condition: always()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: $(Build.ArtifactStagingDirectory)/junit-api.xml
          - publish: $(Build.ArtifactStagingDirectory)/html-api
            artifact: html-api

  # SHARD_COUNT must equal the number of matrix entries below.
  # CI_WORKER_COUNT controls xdist workers per stage (API/infra),
  # not E2E shards. Keep these two values independent.
  - stage: E2ETests
    dependsOn: APITests
    jobs:
      - job: E2EJourneys
        strategy:
          matrix:
            shard_1:
              SHARD_GROUP: 1
            shard_2:
              SHARD_GROUP: 2
            shard_3:
              SHARD_GROUP: 3
            shard_4:
              SHARD_GROUP: 4
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.11'
          - script: pip install -r requirements.txt
            displayName: Install dependencies
          - script: |
              mkdir -p $(Build.ArtifactStagingDirectory)/html-e2e-$(SHARD_GROUP)
              pytest tests/e2e/ tests/ui/ \
                --splits $(SHARD_COUNT) \
                --group $(SHARD_GROUP) \
                --html=$(Build.ArtifactStagingDirectory)/html-e2e-$(SHARD_GROUP)/report.html \
                --self-contained-html \
                --junitxml=$(Build.ArtifactStagingDirectory)/junit-e2e-$(SHARD_GROUP).xml
            displayName: Run UI and E2E shard
            env:
              ENV: $(ENV)
              CI_WORKER_COUNT: $(CI_WORKER_COUNT)
              SHARD_COUNT: $(SHARD_COUNT)
          - task: PublishTestResults@2
            condition: always()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: $(Build.ArtifactStagingDirectory)/junit-e2e-$(SHARD_GROUP).xml
          - publish: $(Build.ArtifactStagingDirectory)/html-e2e-$(SHARD_GROUP)
            artifact: html-e2e-$(SHARD_GROUP)
