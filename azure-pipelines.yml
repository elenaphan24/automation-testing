trigger:
  branches:
    include:
      - main

variables:
  ENV: sandbox
  CI_WORKER_COUNT: 4

stages:
  - stage: StaticChecks
    jobs:
      - job: RuntimeImportPolicy
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.11'
          - script: pip install -r requirements.txt
            displayName: Install dependencies
          - script: python tools/lint_no_runtime_pandas.py
            displayName: Enforce Excel adapter boundary

  - stage: APITests
    dependsOn: StaticChecks
    jobs:
      - job: FastTests
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.11'
          - script: pip install -r requirements.txt
            displayName: Install dependencies
          - script: |
              pytest tests/api/ tests/infra/ \
                -n $(CI_WORKER_COUNT) \
                --dist worksteal \
                --alluredir=$(Build.ArtifactStagingDirectory)/allure-api
            displayName: Run API and infra tests
            env:
              ENV: $(ENV)
              CI_WORKER_COUNT: $(CI_WORKER_COUNT)
          - script: |
              npm install -g allure-commandline
              allure generate $(Build.ArtifactStagingDirectory)/allure-api \
                -o $(Build.ArtifactStagingDirectory)/allure-api-html --clean
            displayName: Generate Allure HTML report
            condition: always()
          - publish: $(Build.ArtifactStagingDirectory)/allure-api-html
            artifact: allure-api

  - stage: E2ETests
    dependsOn: APITests
    jobs:
      - job: E2EJourneys
        strategy:
          matrix:
            shard_1:
              SHARD_GROUP: 1
            shard_2:
              SHARD_GROUP: 2
            shard_3:
              SHARD_GROUP: 3
            shard_4:
              SHARD_GROUP: 4
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.11'
          - script: pip install -r requirements.txt
            displayName: Install dependencies
          - script: |
              pytest tests/e2e/ tests/ui/ \
                --splits $(CI_WORKER_COUNT) \
                --group $(SHARD_GROUP) \
                --alluredir=$(Build.ArtifactStagingDirectory)/allure-e2e-$(SHARD_GROUP)
            displayName: Run UI and E2E shard
            env:
              ENV: $(ENV)
              CI_WORKER_COUNT: $(CI_WORKER_COUNT)
          - script: |
              npm install -g allure-commandline
              allure generate $(Build.ArtifactStagingDirectory)/allure-e2e-$(SHARD_GROUP) \
                -o $(Build.ArtifactStagingDirectory)/allure-e2e-html-$(SHARD_GROUP) --clean
            displayName: Generate Allure HTML report
            condition: always()
          - publish: $(Build.ArtifactStagingDirectory)/allure-e2e-html-$(SHARD_GROUP)
            artifact: allure-e2e-$(SHARD_GROUP)

