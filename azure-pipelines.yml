pr:
  branches:
    include:
      - main
  paths:
    exclude:
      - '*.md'
      - 'docs/**'

trigger:
  branches:
    include:
      - main

schedules:
  - cron: '0 2 * * 1-5'
    displayName: Nightly full regression
    branches:
      include:
        - main
    always: true

variables:
  ENV: sandbox
  CI_WORKER_COUNT: 4
  SHARD_COUNT: 4
  PIP_CACHE_DIR: $(Pipeline.Workspace)/.pip
  PLAYWRIGHT_BROWSERS_PATH: $(Pipeline.Workspace)/.playwright

stages:
  - stage: StaticChecks
    jobs:
      - job: RuntimeImportPolicy
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.11'
          - task: Cache@2
            inputs:
              key: 'pip | "$(Agent.OS)" | requirements.txt'
              restoreKeys: |
                pip | "$(Agent.OS)"
              path: $(PIP_CACHE_DIR)
            displayName: Cache pip packages
          - script: pip install --cache-dir $(PIP_CACHE_DIR) -r requirements.txt
            displayName: Install dependencies
          - script: python tools/lint_no_runtime_pandas.py
            displayName: Enforce Excel adapter boundary

  - stage: APITests
    dependsOn: StaticChecks
    jobs:
      - job: FastTests
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.11'
          - task: Cache@2
            inputs:
              key: 'pip | "$(Agent.OS)" | requirements.txt'
              restoreKeys: |
                pip | "$(Agent.OS)"
              path: $(PIP_CACHE_DIR)
            displayName: Cache pip packages
          - script: pip install --cache-dir $(PIP_CACHE_DIR) -r requirements.txt
            displayName: Install dependencies
          - bash: |
              set -euo pipefail
              MARKER_FILTER=()
              if [ "$(Build.Reason)" = "PullRequest" ]; then
                MARKER_FILTER=(-m "smoke and not quarantine")
              fi

              mkdir -p "$(Build.ArtifactStagingDirectory)/html-api"
              pytest tests/api/ tests/infra/ \
                -x \
                -n "$(CI_WORKER_COUNT)" \
                --dist worksteal \
                --cov=core \
                --cov=business \
                --cov-fail-under=55 \
                --cov-report=xml:"$(Build.ArtifactStagingDirectory)/coverage.xml" \
                --html="$(Build.ArtifactStagingDirectory)/html-api/report.html" \
                --self-contained-html \
                --junitxml="$(Build.ArtifactStagingDirectory)/junit-api.xml" \
                "${MARKER_FILTER[@]}"
            displayName: Run API and infra tests
            env:
              ENV: $(ENV)
              CI_WORKER_COUNT: $(CI_WORKER_COUNT)
          - task: PublishTestResults@2
            condition: always()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: $(Build.ArtifactStagingDirectory)/junit-api.xml
          - task: PublishCodeCoverageResults@2
            condition: always()
            inputs:
              summaryFileLocation: $(Build.ArtifactStagingDirectory)/coverage.xml
          - bash: |
              python - <<'PY'
              import sys
              import xml.etree.ElementTree as ET

              tree = ET.parse('$(Build.ArtifactStagingDirectory)/junit-api.xml')
              root = tree.getroot()
              tests = int(root.get('tests', 0))
              failures = int(root.get('failures', 0)) + int(root.get('errors', 0))
              rate = (tests - failures) / tests if tests else 1
              if rate < 0.9:
                  print(f"QUALITY GATE FAILED: pass rate {rate:.1%} < 90%")
                  sys.exit(1)
              print(f"QUALITY GATE PASSED: pass rate {rate:.1%} >= 90%")
              PY
            displayName: Enforce API pass-rate quality gate
          - publish: $(Build.ArtifactStagingDirectory)/html-api
            artifact: html-api

  # SHARD_COUNT must equal the number of matrix entries below.
  # CI_WORKER_COUNT controls xdist workers per stage (API/infra),
  # not E2E shards. Keep these two values independent.
  - stage: E2ETests
    dependsOn: APITests
    jobs:
      - job: E2EJourneys
        strategy:
          matrix:
            shard_1:
              SHARD_GROUP: 1
            shard_2:
              SHARD_GROUP: 2
            shard_3:
              SHARD_GROUP: 3
            shard_4:
              SHARD_GROUP: 4
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.11'
          - task: Cache@2
            inputs:
              key: 'pip | "$(Agent.OS)" | requirements.txt'
              restoreKeys: |
                pip | "$(Agent.OS)"
              path: $(PIP_CACHE_DIR)
            displayName: Cache pip packages
          - script: pip install --cache-dir $(PIP_CACHE_DIR) -r requirements.txt
            displayName: Install dependencies
          - task: Cache@2
            inputs:
              key: 'playwright | "$(Agent.OS)" | requirements.txt'
              restoreKeys: |
                playwright | "$(Agent.OS)"
              path: $(PLAYWRIGHT_BROWSERS_PATH)
            displayName: Cache Playwright browsers
          - script: playwright install chromium
            displayName: Install Playwright browsers (cache miss path)
            env:
              PLAYWRIGHT_BROWSERS_PATH: $(PLAYWRIGHT_BROWSERS_PATH)
          - bash: |
              set -euo pipefail
              MARKER_FILTER=()
              if [ "$(Build.Reason)" = "PullRequest" ]; then
                MARKER_FILTER=(-m "smoke and not quarantine")
              fi

              mkdir -p "$(Build.ArtifactStagingDirectory)/html-e2e-$(SHARD_GROUP)"
              pytest tests/e2e/ tests/ui/ \
                --splits "$(SHARD_COUNT)" \
                --group "$(SHARD_GROUP)" \
                --reruns 1 \
                --reruns-delay 2 \
                --html="$(Build.ArtifactStagingDirectory)/html-e2e-$(SHARD_GROUP)/report.html" \
                --self-contained-html \
                --junitxml="$(Build.ArtifactStagingDirectory)/junit-e2e-$(SHARD_GROUP).xml" \
                "${MARKER_FILTER[@]}"
            displayName: Run UI and E2E shard
            env:
              ENV: $(ENV)
              CI_WORKER_COUNT: $(CI_WORKER_COUNT)
              SHARD_COUNT: $(SHARD_COUNT)
              PLAYWRIGHT_BROWSERS_PATH: $(PLAYWRIGHT_BROWSERS_PATH)
          - task: PublishTestResults@2
            condition: always()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: $(Build.ArtifactStagingDirectory)/junit-e2e-$(SHARD_GROUP).xml
          - publish: $(Build.ArtifactStagingDirectory)/html-e2e-$(SHARD_GROUP)
            artifact: html-e2e-$(SHARD_GROUP)
