[pytest]
addopts = --html=reports/html_report.html --self-contained-html --junitxml=reports/junit.xml --cov=core --cov=business --cov=flows --cov=utils --cov-report=html:reports/coverage --cov-report=term-missing
testpaths = tests
pythonpath = .
markers =
    smoke: production-safe read-only smoke tests
    ui: browser or page-object tests
    api: API/service tests
    e2e: hybrid UI/API journey tests
    quarantine: known-unstable tests isolated from the main CI run


