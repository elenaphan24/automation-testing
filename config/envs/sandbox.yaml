env: sandbox

urls:
  base_url: https://sandbox.app.example.com
  api_base_url: https://sandbox-api.example.com

auth:
  jwt_secret_var: SANDBOX_JWT_SECRET
  token_expiry_seconds: 3600

database:
  schema_prefix: test_sandbox
  connection_var: SANDBOX_DB_URL

feature_flags:
  visual_regression: true
  parallel_workers_default: 4

